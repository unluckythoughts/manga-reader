services:
  book-reader:
    image: book-reader:latest
    container_name: book-reader
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ../data/book_reader.db:/app/data/book_reader.db
    dns:
      - 1.1.1.1
      - 8.8.8.8
      - 8.8.4.4
    restart: unless-stopped
    networks:
      - book-reader
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://localhost:8080/_status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

