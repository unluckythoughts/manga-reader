version: '3.8'

services:
  book-reader:
    build: ..
    image: book-reader:latest
    container_name: book-reader
    ports:
      - "8080:8080"
    env_file:
      - deploy/.env
    volumes:
      - ../data:/root/data
      - ./.env:/root/.env:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: PostgreSQL database (if using postgresql instead of sqlite)
